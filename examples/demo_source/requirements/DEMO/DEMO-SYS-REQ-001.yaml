id: DEMO-SYS-REQ-001
type: requirement
title: {en: Operating temperature, zh: 工作温度}
statement:
  en: The telescope shall meet its performance requirements at ambient temperatures of {range}.
  zh: 望远镜应在{range}的环境温度下满足性能需求。
values:
  range:
    quantity: environment.temperature
    relation: range
    minimum: -25
    maximum: 15
    unit: degC
    certainty: firm
rationale:
  en: Covers the night-time range of the site with margin ([[DEC-0001]]).
  zh: 覆盖台址夜间温度范围并留有余量（[[DEC-0001]]）。
level: system
allocated_to: DEMO
derives_from:
  - {id: DEMO-SRV-REQ-001, normative_revision: 1}
constrained_by:
  - {id: SITE-COND-001, normative_revision: 1}
verification:
  methods: [analysis]
  criteria: {en: Thermal analysis of each system., zh: 各系统热分析。}
maturity: draft
text_origin: en
