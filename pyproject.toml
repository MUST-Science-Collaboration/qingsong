[build-system]
requires = ["uv_build>=0.10.4,<0.11"]
build-backend = "uv_build"

[project]
name = "qingsong"
version = "0.2.0.dev0"
description = "Requirements kept as checked, versioned engineering records, rendered as documents"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license-files = ["LICENSE"]
authors = [{ name = "MUST Science Collaboration" }]
keywords = ["requirements", "systems engineering", "traceability", "telescope"]
dependencies = [
    "pint>=0.24,<1",
    "pydantic>=2.7,<3",
    "ruamel-yaml>=0.18,<0.19",
    "typer>=0.12,<1",
]

[project.scripts]
qingsong = "qingsong.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pre-commit>=4,<5"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N"]
